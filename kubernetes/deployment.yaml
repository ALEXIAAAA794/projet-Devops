apiVersion: apps/v1
kind: Deployment

metadata:
  name: fil-rouge-devops
  namespace: fil-rouge-devops
  labels:
    app: fil-rouge-devops

spec:
  replicas: 1

  selector:
    matchLabels:
      app: fil-rouge-devops

  template:
    metadata:
      labels:
        app: fil-rouge-devops

    spec:
      containers:
        - name: fil-rouge-devops

          image: fil-rouge-devops:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 3000

          env:
            - name: PORT
              value: "3000"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          volumeMounts:
            - name: sqlite-storage
              mountPath: /app/data

      volumes:
        - name: sqlite-storage
          persistentVolumeClaim:
            claimName: sqlite-pvc